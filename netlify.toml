[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# El sitio se construye con basePath "/sian" para vivir en www.nomadaestudio.digital/sian.
# Aquí los archivos quedan en la raíz, así que /sian/* se sirve desde la raíz.
# Así también sigue funcionando la dirección sian-gonzalez.netlify.app.
[[redirects]]
  from = "/sian"
  to = "/"
  status = 200

[[redirects]]
  from = "/sian/*"
  to = "/:splat"
  status = 200

# Quien entre por la dirección vieja (sian-gonzalez.netlify.app/...) va a la nueva.
# Va después de las reglas de /sian: el proxy del estudio siempre pide /sian/..., así que no lo afecta.
[[redirects]]
  from = "/*"
  to = "https://www.nomadaestudio.digital/sian/:splat"
  status = 301
  force = true
